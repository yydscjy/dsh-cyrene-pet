# dsh-cyrene-pet bundle patch.
# Applied automatically when the package is installed as a profile bundle
# (`dsh plugin --profile web add @yydscjy/dsh-cyrene-pet`): registers the
# pet into the web browser roster (a dsh.client row), so the modules node
# half scans its client bundle into window.__DSH_BOOT__.
- insert:
    - id: cyrene-pet
      name: '@yydscjy/dsh-cyrene-pet'
